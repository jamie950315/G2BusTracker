<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>台灣公車追蹤</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
        color: #111;
        background: #e9edf3;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 100%; }
      body { background: #e9edf3; }
      button { font: inherit; }

      .app-shell {
        width: min(100%, 720px);
        min-height: 100vh;
        margin: 0 auto;
        background: #fff;
        padding-bottom: 64px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: 64px 1fr 64px;
        align-items: center;
        min-height: 92px;
        padding-top: env(safe-area-inset-top);
        color: #fff;
        background: #3f5fc3;
      }

      .topbar h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        text-align: center;
      }

      .icon-button {
        height: 56px;
        border: 0;
        color: #fff;
        background: transparent;
        font-size: 54px;
        line-height: 1;
      }

      .icon-button:disabled { opacity: 0; }

      .header-action {
        height: 56px;
        border: 0;
        color: #fff;
        background: transparent;
        text-align: center;
        font-size: 32px;
        cursor: pointer;
      }
      .header-action:disabled { opacity: 0; cursor: default; }

      .home-menu {
        display: grid;
        gap: 18px;
        padding: 28px 18px;
        background: #eef2f7;
      }
      .home-card {
        display: grid;
        grid-template-columns: 64px 1fr;
        grid-template-rows: auto auto;
        align-items: center;
        min-height: 124px;
        padding: 20px;
        border: 1px solid #d9e0ec;
        border-radius: 16px;
        color: #17366f;
        background: #fff;
        text-align: left;
        box-shadow: 0 5px 18px rgba(44, 72, 126, .08);
      }
      .home-icon { grid-row: 1 / 3; color: #3f5fc3; font-size: 42px; }
      .home-card strong { font-size: 25px; }
      .home-card small { margin-top: 6px; color: #69788d; font-size: 15px; }

      .favorite-toolbar {
        position: sticky;
        top: 92px;
        z-index: 8;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #4797e8;
      }
      .favorite-tabs {
        display: flex;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .favorite-tab, .manage-groups-button {
        min-height: 52px;
        padding: 8px 14px;
        border: 0;
        color: rgba(255,255,255,.72);
        background: transparent;
        white-space: nowrap;
      }
      .favorite-tab.active {
        color: #fff;
        font-weight: 750;
        box-shadow: inset 0 -4px #fff;
      }
      .manage-groups-button {
        min-height: 38px;
        padding: 6px 10px;
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 18px;
        color: #fff;
        font-size: 13px;
      }
      .favorite-list { background: #fff; }
      .favorite-row {
        display: grid;
        width: 100%;
        grid-template-columns: 92px minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        align-items: center;
        gap: 4px 12px;
        min-height: 88px;
        padding: 10px 14px;
        border: 0;
        border-bottom: 1px solid #dfe3e8;
        color: #152d5d;
        background: #fff;
        text-align: left;
      }
      .favorite-eta {
        grid-row: 1 / 3;
        display: grid;
        place-items: center;
        min-height: 52px;
        padding: 6px;
        border-radius: 26px;
        color: #5d6772;
        background: #edf1f4;
        text-align: center;
      }
      .favorite-eta.arriving { color: #fff; background: #df2d2d; }
      .favorite-eta.soon { color: #fff; background: #3f5fc3; }
      .favorite-eta.inactive { font-size: 13px; }
      .favorite-route { align-self: end; font-size: 18px; }
      .favorite-station { align-self: start; color: #303d50; font-size: 16px; }
      .favorite-row small { grid-row: 1 / 3; color: #7b8490; font-size: 12px; }
      .favorite-empty { min-height: 48vh; }

      .favorite-search-panel {
        position: sticky;
        top: 92px;
        z-index: 8;
        display: grid;
        grid-template-columns: 124px minmax(0, 1fr);
        gap: 10px;
        padding: 12px;
        background: #e7edf6;
      }
      .favorite-search-panel label { display: grid; gap: 4px; color: #566477; font-size: 12px; }
      .favorite-search-panel select, .favorite-search-input, .group-row input {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #c8d1df;
        border-radius: 10px;
        color: #152d5d;
        background: #fff;
        font: inherit;
      }
      .favorite-search-results { background: #fff; }
      .route-result {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(80px, auto) 1fr auto;
        gap: 12px;
        align-items: center;
        min-height: 66px;
        padding: 10px 16px;
        border: 0;
        border-bottom: 1px solid #dfe3e8;
        color: #28498a;
        background: #fff;
        text-align: left;
      }
      .route-result span { color: #465468; }
      .route-result b { font-size: 26px; }
      .selected-route-header {
        display: block;
        width: 100%;
        padding: 14px 16px;
        border: 0;
        color: #fff;
        background: #3f5fc3;
        font-size: 22px;
        font-weight: 750;
        text-align: left;
      }
      .search-directions { position: static; top: auto; }
      .favorite-stop-row {
        display: grid;
        grid-template-columns: 1fr 62px;
        align-items: center;
        min-height: 62px;
        padding-left: 18px;
        border-bottom: 1px solid #e1e5ea;
        font-size: 18px;
      }
      .star-button {
        height: 58px;
        border: 0;
        color: #9aa4b2;
        background: transparent;
        font-size: 30px;
      }
      .star-button.active { color: #ff7a1a; }
      .group-manager { display: grid; gap: 12px; padding: 18px; }
      .group-row { display: grid; grid-template-columns: 1fr 72px; gap: 10px; }
      .group-row button, .add-group-button {
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #3f5fc3;
      }
      .group-row button:disabled { background: #b9c1cf; }
      .add-group-button { min-height: 50px; margin-top: 10px; }

      .station-list, .arrival-list { background: #fff; }

      .station-card {
        position: relative;
        display: grid;
        width: 100%;
        padding: 0;
        border: 0;
        border-bottom: 1px solid #d7d7d7;
        text-align: left;
        background: #fff;
      }

      .station-name {
        display: block;
        padding: 10px 16px;
        color: #fff;
        background: #4797e8;
        font-size: 23px;
        line-height: 1.2;
      }

      .station-routes {
        display: block;
        min-height: 58px;
        padding: 12px 72px 12px 16px;
        font-size: 21px;
        line-height: 1.5;
      }

      .station-distance {
        position: absolute;
        right: 14px;
        bottom: 14px;
        color: #6c7687;
        font-size: 14px;
      }

      .location-bar, .detail-footer {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        overflow: hidden;
        padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
        color: #fff;
        background: #8299db;
        text-align: center;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .arrival-row {
        display: grid;
        width: 100%;
        grid-template-columns: 124px 1fr;
        grid-template-rows: 1fr auto;
        gap: 0 12px;
        min-height: 112px;
        padding: 8px 12px;
        border: 0;
        border-bottom: 1px solid #d8d8d8;
        color: #111;
        text-align: left;
        background: #fff;
        cursor: pointer;
      }

      .eta-badge {
        grid-row: 1 / 3;
        display: grid;
        place-items: center;
        min-height: 90px;
        border-radius: 5px;
        color: #fff;
        background: #765347;
        font-size: 25px;
        text-align: center;
      }

      .eta-badge.inactive { background: #aaa; }
      .eta-badge.arriving { background: #df2d2d; }
      .eta-badge.soon { background: #9f29bd; }

      .arrival-route {
        align-self: center;
        font-size: 23px;
        line-height: 1.35;
      }

      .arrival-row small {
        align-self: end;
        justify-self: end;
        color: #555;
        font-size: 12px;
      }

      .direction-tabs {
        position: sticky;
        top: 92px;
        z-index: 9;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #4797e8;
      }

      .direction-tab {
        position: relative;
        min-height: 58px;
        padding: 8px;
        border: 0;
        color: rgba(255, 255, 255, .72);
        background: transparent;
        font-size: 21px;
        cursor: pointer;
      }

      .direction-tab.active { color: #fff; font-weight: 700; }
      .direction-tab.active::after {
        position: absolute;
        right: 36%;
        bottom: 4px;
        left: 36%;
        height: 5px;
        border-radius: 3px;
        background: #fff;
        content: "";
      }

      .glasses-diagnostic {
        padding: 10px 14px;
        color: #8a1f11;
        background: #fff0ed;
        border-bottom: 1px solid #f1b7ad;
        font-size: 13px;
        line-height: 1.4;
      }

      .route-stop-list {
        position: relative;
        padding-left: 18px;
        background: #fff;
      }

      .route-stop-list::after {
        position: absolute;
        top: 0;
        right: 30px;
        bottom: 0;
        width: 2px;
        background: #e0e5eb;
        content: "";
      }

      .route-stop {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr) auto 30px;
        align-items: center;
        min-height: 82px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
      }

      .route-eta {
        display: grid;
        width: 88px;
        min-height: 54px;
        place-items: center;
        border-radius: 28px;
        color: #606a75;
        background: #eff2f5;
        font-size: 20px;
        text-align: center;
      }

      .route-eta.arriving { color: #fff; background: #df2d2d; }
      .route-eta.soon { color: #fff; background: #3f5fc3; }
      .route-eta.inactive { color: #7b8490; background: #e6e9ed; font-size: 14px; }
      .route-stop-name { padding-right: 12px; font-size: 21px; line-height: 1.3; }
      .route-stop.current .route-stop-name { font-weight: 750; }
      .route-bus-plates {
        display: inline-flex;
        max-width: 112px;
        justify-self: end;
        justify-content: flex-end;
        gap: 5px;
        padding-right: 10px;
        flex-wrap: wrap;
      }
      .route-bus-plate {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 16px 3px 3px 16px;
        color: #fff;
        background: #3f5fc3;
        font-size: 13px;
        font-weight: 650;
        line-height: 1;
        white-space: nowrap;
      }

      .timeline-dot {
        position: relative;
        z-index: 2;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #dfe4ea;
      }

      .route-stop.current .timeline-dot {
        width: 20px;
        height: 20px;
        margin-left: -3px;
        border: 4px solid #fff;
        outline: 2px solid #3f5fc3;
        background: #3f5fc3;
      }

      .state-panel {
        display: grid;
        width: 100%;
        min-height: 55vh;
        place-items: center;
        padding: 32px;
        border: 0;
        color: #536174;
        background: #fff;
        font-size: 20px;
        text-align: center;
        white-space: pre-line;
      }

      .retry-button { cursor: pointer; }

      @media (max-width: 480px) {
        .topbar { min-height: 76px; grid-template-columns: 54px 1fr 54px; }
        .topbar h1 { font-size: 21px; }
        .station-name, .arrival-route { font-size: 20px; }
        .station-routes { font-size: 18px; }
        .arrival-row { grid-template-columns: 108px 1fr; min-height: 100px; }
        .eta-badge { min-height: 82px; font-size: 22px; }
        .direction-tabs { top: 76px; }
        .favorite-toolbar, .favorite-search-panel { top: 76px; }
        .favorite-row { grid-template-columns: 78px minmax(0, 1fr) auto; padding: 9px 10px; }
        .favorite-route { font-size: 16px; }
        .favorite-station { font-size: 14px; }
        .favorite-search-panel { grid-template-columns: 108px minmax(0, 1fr); }
        .route-stop { grid-template-columns: 92px minmax(0, 1fr) auto 28px; }
        .route-eta { width: 78px; font-size: 18px; }
        .route-stop-name { font-size: 19px; }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
